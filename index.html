<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZERO // Kassza & Kalkulátor</title>
    <style>
        :root {
            --bg: #0c0e13;
            --card: #141821;
            --input: #1d222f;
            --border: #2a3142;
            --text: #f3f4f6;
            --muted: #9ca3af;
            --green: #10b981;
            --yellow: #f59e0b;
            --red: #ef4444;
            --blue: #3b82f6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .app {
            width: 100%;
            max-width: 980px;
            display: grid;
            grid-template-columns: 1.15fr 0.85fr;
            gap: 18px;
            align-items: start;
        }

        @media (max-width: 820px) {
            .app {
                grid-template-columns: 1fr;
            }
        }

        .box {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 18px;
        }

        .top {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand h1 {
            font-size: 1.25rem;
            letter-spacing: 0.4px;
        }

        .pill {
            font-size: 0.72rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 999px;
            background: rgba(59, 130, 246, 0.14);
            color: #93c5fd;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .tabs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            background: var(--bg);
            padding: 5px;
            border-radius: 8px;
            margin-bottom: 16px;
        }

        .tab {
            background: transparent;
            border: none;
            color: var(--muted);
            padding: 9px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }

        .tab.active {
            background: var(--input);
            color: var(--text);
        }

        .tab[data-tab="sale"].active { border-bottom-color: var(--green); }
        .tab[data-tab="factory"].active { border-bottom-color: var(--red); }
        .tab[data-tab="other"].active { border-bottom-color: var(--blue); }

        .field {
            margin-bottom: 12px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        @media (max-width: 540px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
        }

        label {
            display: block;
            font-size: 0.76rem;
            color: var(--muted);
            margin-bottom: 5px;
        }

        input, select {
            width: 100%;
            background: var(--input);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 9px 11px;
            border-radius: 7px;
            font-size: 0.88rem;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--blue);
        }

        input.req-missing {
            border-color: var(--red);
        }

        .mat-switch {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 4px;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .mat-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--muted);
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
        }

        .mat-btn.active {
            background: var(--input);
            color: var(--text);
            border-color: var(--blue);
        }

        button.action {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 7px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .btn-add {
            background: var(--input);
            color: var(--text);
            border: 1px solid var(--border) !important;
            margin-bottom: 12px;
        }

        .btn-add:hover {
            border-color: var(--blue) !important;
        }

        .btn-send {
            background: var(--blue);
            color: #fff;
            margin-top: 6px;
        }

        .btn-send:hover {
            filter: brightness(1.08);
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
        }

        .chip {
            background: var(--input);
            border: 1px solid var(--border);
            color: var(--muted);
            padding: 5px 9px;
            border-radius: 6px;
            font-size: 0.76rem;
            cursor: pointer;
        }

        .chip:hover {
            color: var(--text);
            border-color: var(--blue);
        }

        .cart {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 7px;
            padding: 8px;
            margin-bottom: 14px;
            min-height: 56px;
            max-height: 170px;
            overflow-y: auto;
        }

        .cart-empty {
            color: var(--muted);
            font-size: 0.82rem;
            text-align: center;
            padding: 12px 0;
        }

        .cart-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 4px;
            border-bottom: 1px solid var(--border);
            font-size: 0.83rem;
            gap: 8px;
        }

        .cart-row:last-child {
            border-bottom: none;
        }

        .cart-tag {
            font-size: 0.7rem;
            color: var(--muted);
            margin-left: 4px;
        }

        .del {
            background: none;
            border: none;
            color: var(--red);
            cursor: pointer;
            font-weight: bold;
            margin-left: 8px;
        }

        .summary {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 14px;
            font-size: 0.84rem;
        }

        .sum-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            color: var(--muted);
        }

        .sum-highlight {
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.25);
            border-radius: 6px;
            padding: 7px 9px;
            margin: 8px 0;
            color: var(--text);
            font-weight: 600;
        }

        .sum-line.total {
            border-top: 1px solid var(--border);
            padding-top: 8px;
            margin: 8px 0 0;
            color: var(--text);
            font-weight: 800;
            font-size: 1.05rem;
        }

        .local-hint {
            margin-top: 8px;
            padding: 8px 10px;
            border-radius: 6px;
            background: rgba(59, 130, 246, 0.08);
            border: 1px solid rgba(59, 130, 246, 0.25);
            font-size: 0.78rem;
            color: #cbd5e1;
            line-height: 1.4;
        }

        .local-hint strong {
            color: #fff;
        }

        .val-green { color: var(--green); font-weight: 700; }

        .section-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .preview-label {
            font-size: 0.74rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .embed {
            background: #2b2d31;
            border-left: 4px solid var(--green);
            border-radius: 5px;
            padding: 12px 14px;
            font-size: 0.85rem;
            color: #dbdee1;
        }

        .embed-title {
            font-weight: 700;
            color: #fff;
            margin-bottom: 6px;
            font-size: 0.94rem;
        }

        .embed-desc {
            font-size: 0.82rem;
            color: #f3f4f6;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 8px;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        .embed-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .embed-item.full {
            grid-column: 1 / -1;
        }

        .embed-k {
            font-size: 0.72rem;
            font-weight: 700;
            color: #fff;
        }

        .embed-v {
            font-size: 0.82rem;
            white-space: pre-line;
        }

        .msg {
            margin-top: 8px;
            font-size: 0.82rem;
            min-height: 18px;
            text-align: center;
            font-weight: 600;
        }

        .pending-box {
            margin-top: 16px;
            background: var(--bg);
            border: 1px solid rgba(245, 158, 11, 0.35);
            border-radius: 8px;
            padding: 12px;
        }

        .pending-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .pending-title {
            font-size: 0.8rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: var(--yellow);
        }

        .pending-count {
            font-size: 0.72rem;
            color: var(--muted);
        }

        .pending-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 280px;
            overflow-y: auto;
        }

        .pending-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-left: 3px solid var(--yellow);
            border-radius: 7px;
            padding: 10px;
            font-size: 0.8rem;
        }

        .pending-top {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 4px;
        }

        .pending-partner {
            font-weight: 700;
            color: #fff;
        }

        .pending-amount {
            font-weight: 800;
            color: var(--yellow);
        }

        .pending-meta {
            font-size: 0.72rem;
            color: var(--muted);
            margin-bottom: 6px;
        }

        .pending-items {
            color: #d1d5db;
            font-size: 0.76rem;
            line-height: 1.35;
            margin-bottom: 8px;
            white-space: pre-line;
        }

        .pending-actions {
            display: flex;
            gap: 6px;
        }

        .btn-import {
            flex: 1;
            background: rgba(16, 185, 129, 0.16);
            color: #6ee7b7;
            border: 1px solid rgba(16, 185, 129, 0.4);
            border-radius: 6px;
            padding: 6px 8px;
            font-size: 0.76rem;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-import:hover {
            background: rgba(16, 185, 129, 0.28);
        }

        .btn-remove-pending {
            background: rgba(239, 68, 68, 0.14);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.35);
            border-radius: 6px;
            padding: 6px 9px;
            font-size: 0.76rem;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-remove-pending:hover {
            background: rgba(239, 68, 68, 0.25);
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="app">
    <div class="box top">
        <div class="brand">
            <h1>ZERO // Kassza</h1>
            <span class="pill">Lőszergyár & Kalkulátor</span>
        </div>
        <div style="width: 230px;">
            <input type="text" id="recorder" placeholder="Rögzítő neve (kötelező)">
        </div>
    </div>

    <!-- Bal oldal: Űrlap -->
    <div class="box">
        <div class="tabs">
            <button class="tab active" data-tab="sale" onclick="setTab('sale')">Eladás</button>
            <button class="tab" data-tab="factory" onclick="setTab('factory')">Gyár kiadás</button>
            <button class="tab" data-tab="other" onclick="setTab('other')">Egyéb</button>
        </div>

        <!-- ELADÁS -->
        <div id="tab-sale">
            <label>Alapanyag forrás (önköltség számítás)</label>
            <div class="mat-switch">
                <button type="button" class="mat-btn" data-mat="own" onclick="setMaterialMode('own')">Saját alapanyag (1$/db · 10$/tár)</button>
                <button type="button" class="mat-btn active" data-mat="bought" onclick="setMaterialMode('bought')">Vett alapanyag (régi ár)</button>
            </div>

            <div class="grid-2 field">
                <div>
                    <label>Kategória</label>
                    <select id="category" onchange="updateCalibers()">
                        <option value="ammo">Lőszer</option>
                        <option value="shotgun">Sörétes lőszer</option>
                        <option value="emptyPistol">Üres pisztolytár</option>
                        <option value="emptyBig">Üres nagy tár</option>
                        <option value="fullPistol">Töltött pisztolytár (+30)</option>
                        <option value="fullBig">Töltött nagy tár (+50)</option>
                    </select>
                </div>
                <div>
                    <label>Kaliber / Típus</label>
                    <select id="caliber"></select>
                </div>
            </div>

            <div class="grid-2 field">
                <div>
                    <label>Ritkaság</label>
                    <select id="rarity">
                        <option value="Common">Common</option>
                        <option value="Uncommon" selected>Uncommon</option>
                        <option value="Rare">Rare</option>
                        <option value="Epic">Epic</option>
                        <option value="Legendary">Legendary</option>
                        <option value="Mythic">Mythic</option>
                    </select>
                </div>
                <div>
                    <label>Darabszám</label>
                    <input type="number" id="qty" value="1000" min="1">
                </div>
            </div>

            <button class="action btn-add" onclick="addItem()">+ Tétel hozzáadása</button>

            <div class="cart" id="cart">
                <div class="cart-empty">Nincs tétel a listában.</div>
            </div>

            <div class="grid-2 field">
                <div>
                    <label>Vevő / Partner</label>
                    <select id="partner" onchange="render()">
                        <option value="other" data-name="Sima vevő">Mindenki más (100k+ felett -10%)</option>
                        <option value="tier" data-name="Mia Keller">Mia Keller (-10% / 100k+ felett -15%)</option>
                        <option value="tier" data-name="Tai (füvesek)">Tai (-10% / 100k+ felett -15%)</option>
                        <option value="tier" data-name="Ravens">Ravens (-10% / 100k+ felett -15%)</option>
                        <option value="tier" data-name="Syndicate (Meth)">Syndicate (-10% / 100k+ felett -15%)</option>
                        <option value="rustata" data-name="Rustata">Rustata (mindig -15%)</option>
                        <option value="drock" data-name="D-Rock">D-Rock (mindig -50%)</option>
                    </select>
                </div>
                <div>
                    <label>Státusz</label>
                    <select id="status" onchange="render()">
                        <option value="paid">Kész (kasszában)</option>
                        <option value="pending">Függőben / tartozás</option>
                    </select>
                </div>
            </div>

            <div class="field">
                <label>Megjegyzés</label>
                <input type="text" id="saleNote" placeholder="pl. Holnap kerül be a széfbe" oninput="render()">
            </div>

            <div class="summary">
                <div class="sum-line"><span>Önköltség:</span><span id="sCost">0 $</span></div>
                <div class="sum-line"><span>Kedvezmény:</span><span id="sDisc">0 $</span></div>
                <div class="sum-line sum-highlight"><span>Tiszta haszon:</span><span id="sProfit" class="val-green">0 $</span></div>
                <div class="sum-line total"><span>Végösszeg:</span><span id="sTotal" class="val-green">0 $</span></div>
                <div class="local-hint" id="sQuote">Csak itt látszik: adj hozzá tételt a kalkulációhoz.</div>
            </div>
        </div>

        <!-- GYÁR KIADÁS -->
        <div id="tab-factory" class="hidden">
            <div class="chips">
                <button class="chip" onclick="setFactory('Tár gyártás (25 db)', 2500)">-2,5k tár gyártás</button>
                <button class="chip" onclick="setFactory('Gyártási díj', 2000)">-2k gyártás</button>
                <button class="chip" onclick="setFactory('Gyártási díj', 4000)">-4k gyártás</button>
                <button class="chip" onclick="setFactory('Gyártási díj', 6000)">-6k gyártás</button>
                <button class="chip" onclick="setFactory('1 gép fullra fejlesztése', 120000)">-120k gép full</button>
                <button class="chip" onclick="setFactory('Alapanyag (1000 db)', 40000)">-40k alapanyag</button>
            </div>
            <div class="grid-2 field">
                <div>
                    <label>Megnevezés</label>
                    <input type="text" id="fTitle" placeholder="pl. Puskapor" oninput="render()">
                </div>
                <div>
                    <label>Összeg ($)</label>
                    <input type="number" id="fAmount" placeholder="pl. 8000" oninput="render()">
                </div>
            </div>
            <div class="field">
                <label>Megjegyzés</label>
                <input type="text" id="fNote" oninput="render()">
            </div>
        </div>

        <!-- EGYÉB -->
        <div id="tab-other" class="hidden">
            <div class="grid-2 field">
                <div>
                    <label>Típus</label>
                    <select id="oType" onchange="render()">
                        <option value="expense">Kiadás (-)</option>
                        <option value="income">Bevétel (+)</option>
                    </select>
                </div>
                <div>
                    <label>Összeg ($)</label>
                    <input type="number" id="oAmount" placeholder="pl. 75000" oninput="render()">
                </div>
            </div>
            <div class="field">
                <label>Megnevezés</label>
                <input type="text" id="oTitle" placeholder="pl. Fegyverek / Nátrium-klorid" oninput="render()">
            </div>
            <div class="field">
                <label>Megjegyzés</label>
                <input type="text" id="oNote" oninput="render()">
            </div>
        </div>

        <button class="action btn-send" onclick="send()">Küldés Discordra</button>
        <div class="msg" id="msg"></div>
    </div>

    <!-- Jobb oldal: Discord előnézet + Helyi Függőben / Tartozás adatbázis -->
    <div class="box">
        <div class="section-head">
            <span class="preview-label">Discord előnézet</span>
            <span class="preview-label" id="statusBadge" style="color: var(--green);">KÉSZ</span>
        </div>

        <div class="embed" id="embed">
            <div class="embed-title" id="eTitle">Eladás (Kész)</div>
            <div class="embed-desc" id="eDesc">👤 Rögzítette: —</div>
            <div class="embed-grid" id="eFields"></div>
        </div>

        <div class="pending-box">
            <div class="pending-head">
                <span class="pending-title">Helyi Függőben / Tartozás</span>
                <span class="pending-count" id="pendingCount">0 mentett</span>
            </div>
            <div class="pending-list" id="pendingList"></div>
        </div>
    </div>
</div>

        emptyBig: ['5.56×45 mm NATO tár', '7.62×39 mm tár', '7.62×51 mm NATO tár', '9×19 mm géppisztolytár', '.45 ACP géppisztoly dobtár'],
        fullPistol: ['9×19 mm Parabellum tár (töltött)', '.45 ACP tár (töltött)', 'Desert Eagle (.44 Magnum) tár (töltött)'],
        fullBig: ['5.56×45 mm NATO tár (töltött)', '7.62×39 mm tár (töltött)', '7.62×51 mm NATO tár (töltött)', '9×19 mm géppisztolytár (töltött)', '.45 ACP dobtár (töltött)']
    };

    let tab = 'sale';
    let materialMode = 'bought'; // 'own' | 'bought'
    let cart = [];

    const money = n => Math.round(n).toLocaleString('hu-HU') + ' $';

    function getCostTag(mode) {
        return mode === 'own' ? 'gyári' : 'vett';
    }

    function getEffectiveMode() {
        if (cart.length > 0) {
            return cart[0].mode || materialMode;
        }
        return materialMode;
    }

    function getUnitCost(cat, rar, mode) {
        if (mode === 'own') {
            if (cat === 'ammo' || cat === 'shotgun') return 1;
            if (cat === 'emptyPistol' || cat === 'emptyBig') return 10;
            if (cat === 'fullPistol') return 10 + 30 * 1;
            if (cat === 'fullBig') return 10 + 50 * 1;
        }
        return PRICES[cat][rar].cost;
    }

    function setMaterialMode(mode) {
        materialMode = mode;
        document.querySelectorAll('.mat-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.mat === mode);
        });
        render();
    }

    function normText(v) {
        return String(v || '').trim().toLowerCase();
    }

    function setPartnerInSelect(partnerRole, partnerName) {
        const pSel = document.getElementById('partner');
        const targetName = normText(partnerName);
        const targetRole = normText(partnerRole);

        let matchedOption = null;

        if (targetName) {
            matchedOption = Array.from(pSel.options).find(opt => {
                const dName = normText(opt.dataset.name);
                const text = normText(opt.textContent);
                return dName === targetName || text.startsWith(targetName) || text.includes(targetName);
            });
        }

        if (!matchedOption && targetRole) {
            matchedOption = Array.from(pSel.options).find(opt => normText(opt.value) === targetRole);
        }

        if (!matchedOption && partnerName && partnerName.trim()) {
            const cleanName = partnerName.trim();
            const roleVal = (['tier', 'rustata', 'drock', 'other'].includes(targetRole)) ? partnerRole : 'other';
            const newOpt = document.createElement('option');
            newOpt.value = roleVal;
            newOpt.dataset.name = cleanName;
            newOpt.textContent = `${cleanName} (importált)`;
            pSel.appendChild(newOpt);
            matchedOption = newOpt;
        }

        if (matchedOption) {
            pSel.value = matchedOption.value;
            Array.from(pSel.options).forEach(opt => {
                opt.selected = (opt === matchedOption);
            });
            pSel.dispatchEvent(new Event('change'));
        }
    }

    function getPendingOrders() {
        try {
            const raw = localStorage.getItem(PENDING_STORAGE_KEY);
            const parsed = raw ? JSON.parse(raw) : [];
            return Array.isArray(parsed) ? parsed : [];
        } catch {
            return [];
        }
    }

    function savePendingOrders(orders) {
        localStorage.setItem(PENDING_STORAGE_KEY, JSON.stringify(orders));
    }

    function saveCurrentSaleToPending() {
        const pSel = document.getElementById('partner');
        const selectedOpt = pSel.options[pSel.selectedIndex];
        const partnerRole = pSel.value;
        const partnerName = (selectedOpt && selectedOpt.dataset.name) ? selectedOpt.dataset.name : (selectedOpt ? selectedOpt.textContent : 'Sima vevő');
        const note = document.getElementById('saleNote').value.trim();
        const recorder = document.getElementById('recorder').value.trim().toUpperCase() || '—';

        let rawSell = 0;
        cart.forEach(x => { rawSell += x.qty * x.sell; });
        const discPct = getDiscountPercent(partnerRole, rawSell);
        const total = rawSell - Math.round(rawSell * (discPct / 100));

        const orders = getPendingOrders();
        orders.unshift({
            id: Date.now() + '_' + Math.random().toString(36).slice(2, 7),
            createdAt: new Date().toLocaleString('hu-HU'),
            recorder,
            partnerRole,
            partnerName,
            materialMode,
            note,
            total,
            items: cart.map(x => ({ ...x }))
        });
        savePendingOrders(orders);
        renderPendingOrders();
    }

    function importPendingOrder(orderId) {
        const orders = getPendingOrders();
        const found = orders.find(o => o.id === orderId);
        if (!found) return;

        setTab('sale');
        const restoredMode = found.materialMode === 'own' ? 'own' : 'bought';
        setMaterialMode(restoredMode);

        cart = (found.items || []).map(x => {
            const fallbackCost = (x.cat && x.rar) ? getUnitCost(x.cat, x.rar, restoredMode) : 0;
            return {
                ...x,
                cost: typeof x.cost === 'number' ? x.cost : fallbackCost
            };
        });
        renderCart();

        setPartnerInSelect(found.partnerRole, found.partnerName);
        document.getElementById('status').value = 'paid';
        document.getElementById('saleNote').value = found.note || '';

        const recInput = document.getElementById('recorder');
        if (!recInput.value.trim() && found.recorder && found.recorder !== '—') {
            recInput.value = found.recorder;
        }

        render();

        const pSel = document.getElementById('partner');
        const activeName = pSel.options[pSel.selectedIndex]?.dataset?.name || found.partnerName || 'Sima vevő';
        const msg = document.getElementById('msg');
        msg.style.color = '#10b981';
        msg.textContent = `Beimportálva: ${activeName} (${money(found.total)}) — státusz: Kész.`;
    }

    function deletePendingOrder(orderId) {
        const filtered = getPendingOrders().filter(o => o.id !== orderId);
        savePendingOrders(filtered);
        renderPendingOrders();
    }

    function renderPendingOrders() {
        const listEl = document.getElementById('pendingList');
        const countEl = document.getElementById('pendingCount');
        const orders = getPendingOrders();

        countEl.textContent = `${orders.length} mentett`;

        if (!orders.length) {
            listEl.innerHTML = '<div class="cart-empty">Nincs helyben mentett függő rendelés.</div>';
            return;
        }

        listEl.innerHTML = orders.map(o => {
            const itemsText = (o.items || []).map(x => `• ${x.qty} db ${x.cal} (${x.rar})`).join('\n');
            const modeLabel = o.materialMode === 'own' ? 'gyári' : 'vett';
            return `
                <div class="pending-card">
                    <div class="pending-top">
                        <span class="pending-partner">${escapeHtml(o.partnerName || 'Sima vevő')}</span>
                        <span class="pending-amount">${money(o.total || 0)}</span>
                    </div>
                    <div class="pending-meta">${escapeHtml(o.createdAt || '')} • ${modeLabel} • Rögzítette: ${escapeHtml(o.recorder || '—')}${o.note ? ' • ' + escapeHtml(o.note) : ''}</div>
                    <div class="pending-items">${escapeHtml(itemsText)}</div>
                    <div class="pending-actions">
                        <button type="button" class="btn-import" onclick="importPendingOrder('${o.id}')">Rendelés beimportálása</button>
                        <button type="button" class="btn-remove-pending" onclick="deletePendingOrder('${o.id}')" title="Törlés a helyi listából">✕</button>
                    </div>
                </div>
            `;
        }).join('');
    }

    function escapeHtml(str) {
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    function getDiscountPercent(buyerRole, rawSell) {
        if (buyerRole === 'drock') return 50;
        if (buyerRole === 'rustata') return 15;
        if (buyerRole === 'tier') return rawSell > DISCOUNT_THRESHOLD ? 15 : 10;
        return rawSell > DISCOUNT_THRESHOLD ? 10 : 0;
    }

    function updateCalibers() {
        const cat = document.getElementById('category').value;
        document.getElementById('caliber').innerHTML = CALIBERS[cat]
            .map(c => `<option value="${c}">${c}</option>`).join('');
        document.getElementById('qty').value = (cat === 'ammo' || cat === 'shotgun') ? 1000 : 5;
    }

    function addItem() {
        const cat = document.getElementById('category').value;
        const cal = document.getElementById('caliber').value;
        const rar = document.getElementById('rarity').value;
        const qty = parseInt(document.getElementById('qty').value, 10) || 0;
        if (qty <= 0) return;

        const sell = PRICES[cat][rar].sell;
        const cost = getUnitCost(cat, rar, materialMode);
        cart.push({ cat, cal, rar, qty, cost, sell, mode: materialMode });
        renderCart();
        render();
    }

    function removeItem(i) {
        cart.splice(i, 1);
        renderCart();
        render();
    }

    function renderCart() {
        const el = document.getElementById('cart');
        if (!cart.length) {
            el.innerHTML = '<div class="cart-empty">Nincs tétel a listában.</div>';
            return;
        }
        el.innerHTML = cart.map((x, i) => {
            const tag = getCostTag(x.mode || materialMode);
            return `
                <div class="cart-row">
                    <span><strong>${x.qty} db</strong> ${x.cal} (${x.rar})<span class="cart-tag">[${tag}]</span></span>
                    <span><strong>${money(x.qty * x.sell)}</strong><button class="del" onclick="removeItem(${i})">✕</button></span>
                </div>
            `;
        }).join('');
    }

    function setTab(next) {
        tab = next;
        document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === next));
        document.getElementById('tab-sale').classList.toggle('hidden', next !== 'sale');
        document.getElementById('tab-factory').classList.toggle('hidden', next !== 'factory');
        document.getElementById('tab-other').classList.toggle('hidden', next !== 'other');
        render();
    }

    function setFactory(title, amount) {
        document.getElementById('fTitle').value = title;
        document.getElementById('fAmount').value = amount;
        render();
    }

    function updateLocalQuote(buyerRole, rawSell, total, discPct) {
        const quoteEl = document.getElementById('sQuote');
        if (!rawSell) {
            quoteEl.innerHTML = 'Csak itt látszik: adj hozzá tételt a kalkulációhoz.';
            return;
        }
        if (buyerRole === 'drock') {
            quoteEl.innerHTML = `Vevőnek mondandó: <strong>${money(total)}</strong> (D-Rock fix 50% kedvezmény aktív).`;
            return;
        }
        if (buyerRole === 'rustata') {
            quoteEl.innerHTML = `Vevőnek mondandó: <strong>${money(total)}</strong> (Rustata fix 15% kedvezmény aktív).`;
            return;
        }
        if (rawSell > DISCOUNT_THRESHOLD) {
            quoteEl.innerHTML = `Vevőnek mondandó: <strong>${money(total)}</strong> (${discPct}% kedvezmény aktív, 100k+ felett).`;
        } else {
            const missing = Math.max(0, (DISCOUNT_THRESHOLD + 1) - rawSell);
            const nextPct = buyerRole === 'tier' ? 15 : 10;
            const hypothetical100k = Math.round(rawSell * (1 - nextPct / 100));
            quoteEl.innerHTML =
                `Vevőnek mondandó: <strong>${money(total)}</strong> (aktuális: -${discPct}%) • ` +
                `Még <strong>${money(missing)}</strong> kell a <strong>-${nextPct}%</strong>-hoz ` +
                `(100k+ sávban kb. <strong>${money(hypothetical100k)}</strong>).`;
        }
    }

    function buildPayload() {
        const rawRecorder = document.getElementById('recorder').value.trim();
        const upperRecorder = rawRecorder ? rawRecorder.toUpperCase() : '—';
        const description = `👤 **Rögzítette:** \`${upperRecorder}\``;

        let color = 0x10b981;
        let title = '';
        let fields = [];

        if (tab === 'sale') {
            const pSel = document.getElementById('partner');
            const selectedOpt = pSel.options[pSel.selectedIndex];
            const buyerRole = pSel.value;
            const pName = (selectedOpt && selectedOpt.dataset.name) ? selectedOpt.dataset.name : (selectedOpt ? selectedOpt.textContent : 'Sima vevő');
            const status = document.getElementById('status').value;
            const note = document.getElementById('saleNote').value.trim();

            let rawSell = 0, rawCost = 0;
            cart.forEach(x => {
                rawSell += x.qty * x.sell;
                const unitCost = (x.cat && x.rar)
                    ? getUnitCost(x.cat, x.rar, x.mode || materialMode)
                    : x.cost;
                rawCost += x.qty * unitCost;
            });

            const activeMode = getEffectiveMode();
            const costTag = getCostTag(activeMode);
            const discPct = getDiscountPercent(buyerRole, rawSell);
            const discVal = Math.round(rawSell * (discPct / 100));
            const total = rawSell - discVal;
            const profit = total - rawCost;
            const costDisplay = `${money(rawCost)} (${costTag})`;

            document.getElementById('sCost').textContent = costDisplay;
            document.getElementById('sDisc').textContent = discVal ? `-${money(discVal)} (${discPct}%)` : '0 $';
            document.getElementById('sProfit').textContent = (profit >= 0 ? '+' : '') + money(profit);
            document.getElementById('sTotal').textContent = '+' + money(total);
            updateLocalQuote(buyerRole, rawSell, total, discPct);

            color = status === 'paid' ? 0x10b981 : 0xf59e0b;
            title = status === 'paid' ? 'Eladás (Kész)' : 'Függőben / Tartozás';

            fields = [
                { name: 'Partner', value: discPct ? `${pName} (-${discPct}%)` : pName, inline: true },
                { name: 'Bevétel', value: `**+${money(total)}**`, inline: true },
                { name: 'Tételek', value: cart.length ? cart.map(x => `• **${x.qty} db** ${x.cal} (${x.rar})`).join('\n') : '*Nincs tétel*', inline: false },
                { name: 'Önköltség', value: costDisplay, inline: true },
                { name: 'Tiszta haszon', value: `**${profit >= 0 ? '+' : ''}${money(profit)}**`, inline: true }
            ];
            if (note) fields.push({ name: 'Megjegyzés', value: note, inline: false });
        } else if (tab === 'factory') {
            const fTitle = document.getElementById('fTitle').value.trim() || 'Gyári kiadás';
            const fAmt = parseInt(document.getElementById('fAmount').value, 10) || 0;
            const fNote = document.getElementById('fNote').value.trim();
            color = 0xef4444;
            title = 'Gyár kiadás';
            fields = [
                { name: 'Összeg', value: `**-${money(fAmt)}**`, inline: true },
                { name: 'Megnevezés', value: fTitle, inline: true }
            ];
            if (fNote) fields.push({ name: 'Megjegyzés', value: fNote, inline: false });
        } else {
            const isExp = document.getElementById('oType').value === 'expense';
            const oAmt = parseInt(document.getElementById('oAmount').value, 10) || 0;
            const oTitle = document.getElementById('oTitle').value.trim() || 'Frakció tétel';
            const oNote = document.getElementById('oNote').value.trim();
            color = isExp ? 0xef4444 : 0x10b981;
            title = isExp ? 'Egyéb kiadás' : 'Egyéb bevétel';
            fields = [
                { name: 'Összeg', value: `**${isExp ? '-' : '+'}${money(oAmt)}**`, inline: true },
                { name: 'Megnevezés', value: oTitle, inline: true }
            ];
            if (oNote) fields.push({ name: 'Megjegyzés', value: oNote, inline: false });
        }

        return {
            username: 'ZERO Kassza',
            embeds: [{ color, title, description, fields, timestamp: new Date().toISOString() }]
        };
    }

    function render() {
        const embed = buildPayload().embeds[0];
        const badge = document.getElementById('statusBadge');
        document.getElementById('embed').style.borderLeftColor = '#' + embed.color.toString(16).padStart(6, '0');
        document.getElementById('eTitle').textContent = embed.title;
        document.getElementById('eDesc').textContent = embed.description.replace(/\*\*|`/g, '');

        if (embed.color === 0x10b981) {
            badge.textContent = 'KÉSZ / BEVÉTEL';
            badge.style.color = 'var(--green)';
        } else if (embed.color === 0xf59e0b) {
            badge.textContent = 'FÜGGŐBEN';
            badge.style.color = 'var(--yellow)';
        } else {
            badge.textContent = 'KIADÁS';
            badge.style.color = 'var(--red)';
        }

        document.getElementById('eFields').innerHTML = embed.fields.map(f => `
            <div class="embed-item ${f.inline ? '' : 'full'}">
                <div class="embed-k">${f.name}</div>
                <div class="embed-v">${f.value.replace(/\*\*/g, '')}</div>
            </div>
        `).join('');
    }

    async function send() {
        const recorderEl = document.getElementById('recorder');
        const recorder = recorderEl.value.trim();
        const msg = document.getElementById('msg');

        recorderEl.classList.remove('req-missing');

        if (!recorder) {
            recorderEl.classList.add('req-missing');
            msg.style.color = 'var(--red)';
            msg.textContent = 'Add meg a rögzítő nevét, nélküle nem küldhető el!';
            recorderEl.focus();
            return;
        }
        if (!WEBHOOK_URL || WEBHOOK_URL === 'IDE_MASOLD_A_WEBHOOK_URL_T') {
            msg.style.color = 'var(--red)';
            msg.textContent = 'Állítsd be a fix WEBHOOK_URL-t a kódban!';
            return;
        }
        if (tab === 'sale' && !cart.length) {
            msg.style.color = 'var(--red)';
            msg.textContent = 'Adj hozzá legalább egy tételt!';
            return;
        }

        localStorage.setItem('zero_rec', recorder);
        msg.style.color = 'var(--muted)';
        msg.textContent = 'Küldés...';

        const currentSaleStatus = tab === 'sale' ? document.getElementById('status').value : null;

        try {
            const res = await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(buildPayload())
            });
            if (res.ok) {
                msg.style.color = 'var(--green)';
                msg.textContent = 'Elküldve!';
                if (tab === 'sale') {
                    if (currentSaleStatus === 'pending') {
                        saveCurrentSaleToPending();
                    }
                    cart = [];
                    renderCart();
                    document.getElementById('saleNote').value = '';
                }
                render();
            } else {
                msg.style.color = 'var(--red)';
                msg.textContent = `Hiba (${res.status})`;
            }
        } catch {
            msg.style.color = 'var(--red)';
            msg.textContent = 'Hálózati hiba.';
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('recorder').value = localStorage.getItem('zero_rec') || '';
        document.getElementById('recorder').addEventListener('input', () => {
            localStorage.setItem('zero_rec', document.getElementById('recorder').value.trim());
            render();
        });

        updateCalibers();
        renderPendingOrders();
        render();
    });
</script>

</body>
</html>
